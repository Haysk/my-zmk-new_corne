draw_config:
  n_columns: 1
  draw_key_sides: true
  key_w: 60.0
  key_h: 56.0
  split_gap: 30.0
  combo_w: 28.0
  combo_h: 26.0
  key_rx: 6.0
  key_ry: 6.0
  inner_pad_w: 2.0
  inner_pad_h: 2.0
  outer_pad_w: 40.0
  outer_pad_h: 56.0
  line_spacing: 1.2
  arc_radius: 6.0
  append_colon_to_layer_header: true
  small_pad: 2.0
  svg_extra_style: |
    svg.keymap {
      font-family: Ubuntu Mono, Inconsolata, Consolas, Liberation Mono, Menlo, monospace;
      font-size: 12px;
      font-weight: bold;
      text-rendering: optimizeLegibility;
    }
    rect.held, rect.combo.held {
        fill: #ffc;
    }
  shrink_wide_legends: 6
  glyph_tap_size: 18
  glyph_hold_size: 15
  glyph_shifted_size: 15
  glyphs: {}
  glyph_urls:
    tabler: https://unpkg.com/@tabler/icons/icons/outline/{}.svg
    tablerf: https://unpkg.com/@tabler/icons/icons/filled/{}.svg
    mdi: https://raw.githubusercontent.com/Templarian/MaterialDesign-SVG/master/svg/{}.svg
    mdil: https://raw.githubusercontent.com/Pictogrammers/MaterialDesignLight/master/svg/{}.svg
    material: https://fonts.gstatic.com/s/i/short-term/release/materialsymbolsoutlined/{}/default/48px.svg
  use_local_cache: true

parse_config:
  mark_alternate_layer_activators: true
  sticky_label: $$mdi:gesture-tap-hold$$
  trans_legend:
    tap: $$mdi:transfer$$
    type: trans

  raw_binding_map:
    # Scroll (Graphite stick)
    "&msc SCRL_UP":
      tap: $$mdi:pan-up$$
      hold: ''
      shifted: ''
    "&msc SCRL_DOWN":
      tap: $$mdi:pan-down$$
      hold: ''
      shifted: ''
    "&msc SCRL_LEFT":
      tap: $$mdi:pan-left$$
      hold: ''
      shifted: ''
    "&msc SCRL_RIGHT":
      tap: $$mdi:pan-right$$
      hold: ''
      shifted: ''
    # Mouse
    "&mkp LCLK":
      tap: $$mdi:mouse-left-click-outline$$
    "&mkp RCLK":
      tap: $$mdi:mouse-right-click-outline$$
    # Power
    "&soft_off":
      tap: $$mdi:power-sleep$$
    # NUMBER stick — virtual desktops
    "&kp LG(TAB)":
      tap: $$mdi:view-dashboard-outline$$
    "&kp LG(LC(LEFT))":
      tap: $$mdi:arrow-left-bold-box-outline$$
    "&kp LG(LC(RIGHT))":
      tap: $$mdi:arrow-right-bold-box-outline$$
    "&kp LG(D)":
      tap: $$mdi:monitor-clean$$
    "&kp LG(LC(D))":
      tap: $$mdi:plus-box-outline$$
    # SYMBOL stick — window snapping
    "&kp LG(UP)":
      tap: $$mdi:arrow-expand-up$$
    "&kp LG(LEFT)":
      tap: $$mdi:arrow-expand-left$$
    "&kp LG(RIGHT)":
      tap: $$mdi:arrow-expand-right$$
    "&kp LG(DOWN)":
      tap: $$mdi:arrow-collapse-down$$
    "&kp LG(LS(S))":
      tap: $$mdi:camera-outline$$
    # SYMBOL encoder click — clipboard history
    "&kp LG(FR_V)":
      tap: $$mdi:clipboard-multiple-outline$$
    # Graphite stick click — address bar
    "&kp LC(FR_L)":
      tap: $$mdi:web$$
    # NUMBER encoder click — zoom reset
    "&kp LC(FR_N0)":
      tap: '100%'
    # Bluetooth
    "&bt BT_PRV":
      tap: $$mdi:bluetooth$$
      hold: $$mdi:arrow-left$$
    "&bt BT_NXT":
      tap: $$mdi:bluetooth$$
      hold: $$mdi:arrow-right$$
    "&bt BT_CLR":
      tap: $$mdi:bluetooth-off$$
    # System
    "&sys_reset":
      type: bootloader
      tap: $$mdi:backup-restore$$
    "&bootloader":
      tap: $$mdi:progress-download$$
    "&none":
      tap: $$mdi:minus-circle-outline$$
      type: none

  zmk_keycode_map:
    # FR locale — letters
    FR_A: a
    FR_B: b
    FR_C: c
    FR_D: d
    FR_E: e
    FR_F: f
    FR_G: g
    FR_H: h
    FR_I: i
    FR_J: j
    FR_K: k
    FR_L: l
    FR_M: m
    FR_N: n
    FR_O: o
    FR_P: p
    FR_Q: q
    FR_R: r
    FR_S: s
    FR_T: t
    FR_U: u
    FR_V: v
    FR_W: w
    FR_X: x
    FR_Y: y
    FR_Z: z
    # FR locale — numbers
    FR_N0: '0'
    FR_N1: '1'
    FR_N2: '2'
    FR_N3: '3'
    FR_N4: '4'
    FR_N5: '5'
    FR_N6: '6'
    FR_N7: '7'
    FR_N8: '8'
    FR_N9: '9'
    # FR locale — accented
    FR_E_ACUTE: é
    FR_E_GRAVE: è
    FR_A_GRAVE: à
    FR_U_GRAVE: ù
    FR_C_CEDILLA: ç
    # FR locale — symbols
    FR_SQT: "'"
    FR_COLON: ":"
    FR_SEMICOLON: ";"
    FR_SLASH: "/"
    FR_PERIOD: "."
    FR_COMMA: ","
    FR_MINUS: "-"
    FR_PLUS: "+"
    FR_EQUAL: "="
    FR_UNDERSCORE: "_"
    FR_ASTERISK: "*"
    FR_LEFT_BRACKET: "["
    FR_RIGHT_BRACKET: "]"
    FR_LEFT_BRACE: "{"
    FR_RIGHT_BRACE: "}"
    FR_LEFT_PARENTHESIS: "("
    FR_RIGHT_PARENTHESIS: ")"
    FR_LESS_THAN: "<"
    FR_GREATER_THAN: ">"
    FR_CARET: "^"
    FR_GRAVE: "`"
    FR_TILDE: "~"
    FR_PIPE: "|"
    FR_AMPERSAND: "&"
    FR_HASH: "#"
    FR_AT_SIGN: "@"
    FR_DOLLAR: "$"
    FR_PERCENT: "%"
    FR_EXCLAMATION: "!"
    FR_QUESTION: "?"
    FR_BACKSLASH: '\\'
    # KP — numpad
    KP_N0: '0'
    KP_N1: '1'
    KP_N2: '2'
    KP_N3: '3'
    KP_N4: '4'
    KP_N5: '5'
    KP_N6: '6'
    KP_N7: '7'
    KP_N8: '8'
    KP_N9: '9'
    KP_MULTIPLY: "×"
    KP_MINUS: "-"
    KP_PLUS: "+"
    KP_DOT: "."
    KP_DIVIDE: "/"
    KP_EQUAL: "="
    # Modifiers
    LCTRL: Ctrl
    LEFT_CONTROL: Ctrl
    LALT: Alt
    LEFT_ALT: Alt
    LSHIFT: $$mdi:apple-keyboard-shift$$
    LEFT_SHIFT: $$mdi:apple-keyboard-shift$$
    LEFT_WIN: $$mdi:microsoft-windows$$
    LEFT_GUI: $$mdi:microsoft-windows$$
    RCTRL: Ctrl
    RIGHT_CONTROL: Ctrl
    RALT: Alt
    RIGHT_ALT: Alt
    RSHIFT: $$mdi:apple-keyboard-shift$$
    RIGHT_SHIFT: $$mdi:apple-keyboard-shift$$
    RIGHT_GUI: $$mdi:microsoft-windows$$
    # Arrows
    UP: $$mdi:arrow-up-bold$$
    UP_ARROW: $$mdi:arrow-up-bold$$
    DOWN: $$mdi:arrow-down-bold$$
    DOWN_ARROW: $$mdi:arrow-down-bold$$
    LEFT: $$mdi:arrow-left-bold$$
    LEFT_ARROW: $$mdi:arrow-left-bold$$
    RIGHT: $$mdi:arrow-right-bold$$
    RIGHT_ARROW: $$mdi:arrow-right-bold$$
    # Navigation
    PAGE_UP: PgUp
    PAGE_DOWN: PgDn
    HOME: Home
    END: End
    INSERT: Ins
    # Whitespace
    ENTER:
      type: enter
      tap: $$mdi:keyboard-return$$
    RET:
      type: enter
      tap: $$mdi:keyboard-return$$
    ESC: $$mdi:keyboard-esc$$
    ESCAPE: $$mdi:keyboard-esc$$
    TAB: $$mdi:keyboard-tab$$
    SPACE: $$mdi:keyboard-space$$
    BACKSPACE:
      type: backspace
      tap: $$mdi:backspace$$
    BSPC:
      type: backspace
      tap: $$mdi:backspace$$
    DELETE: $$mdi:backspace-reverse-outline$$
    DEL: $$mdi:backspace-reverse-outline$$
    # Locks
    CAPSLOCK: $$mdi:apple-keyboard-caps$$
    CAPS: $$mdi:apple-keyboard-caps$$
    # Sound
    C_VOLUME_UP: $$mdi:volume-high$$
    C_VOL_UP: $$mdi:volume-high$$
    C_VOLUME_DOWN: $$mdi:volume-low$$
    C_VOL_DN: $$mdi:volume-low$$
    C_MUTE: $$mdi:volume-off$$
    K_MUTE: $$mdi:volume-off$$
    # Application key
    K_APP: $$mdi:menu$$
    # Function keys
    F1: F1
    F2: F2
    F3: F3
    F4: F4
    F5: F5
    F6: F6
    F7: F7
    F8: F8
    F9: F9
    F10: F10
    F11: F11
    F12: F12
    # RGB
    RGB_TOG: $$mdi:led-strip$$
    RGB_ON: $$mdi:led-on$$
    RGB_OFF: $$mdi:led-off$$
    RGB_BRI: $$mdi:brightness-5$$
    RGB_BRD: $$mdi:brightness-4$$
    RGB_SAI: Sat+
    RGB_SAD: Sat-
    RGB_HUI: Hue+
    RGB_HUD: Hue-
    RGB_SPI: Spd+
    RGB_SPD: Spd-
    RGB_EFF: $$mdi:palette$$
    RGB_EFR: $$mdi:palette$$
    # Screenshot
    PSCRN: $$mdi:camera-outline$$

  zmk_combos:
    softoff:
      align: top
      offset: 0.5
